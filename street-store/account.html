<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101426"><title>Profil Pelanggan — Street Store</title><link rel="icon" href="assets/icons/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"><script type="module" src="js/app.js"></script></head><body data-page="account"><div id="site-header"></div><main id="main-content" class="wrap page-shell"><div class="page-heading"><span class="eyebrow">YOUR DETAILS</span><h1>Profil <span class="gradient-text">pelanggan.</span></h1><p>Simpan nama dan kontak untuk memudahkan pengisian checkout pada browser ini. Akun tidak diwajibkan untuk belanja.</p></div><form id="account-form" class="form-card narrow-form"><div class="field"><label for="account-name">Nama lengkap</label><input class="input" id="account-name" name="name" autocomplete="name" maxlength="100" placeholder="Nama kamu"></div><div class="field"><label for="account-phone">Nomor WhatsApp</label><input class="input" id="account-phone" name="phone" inputmode="tel" autocomplete="tel" maxlength="25" placeholder="Nomor yang bisa dihubungi"></div><div class="field"><label for="account-address">Alamat (opsional)</label><textarea class="input" id="account-address" name="address" rows="3" maxlength="500" placeholder="Alamat pengiriman"></textarea></div><div class="form-actions"><button class="btn btn-primary" type="submit">Simpan profil</button><button class="btn btn-ghost" type="button" id="clear-account">Hapus data profil</button></div><p class="small-note">Informasi ini tersimpan lokal di browser dan bukan akun online.</p></form></main><div id="site-footer"></div><div id="toast-root" class="toast-root" aria-live="polite"></div></body></html>
