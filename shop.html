<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101426"><title>Katalog — Street Store</title><link rel="icon" href="assets/icons/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"><script type="module" src="js/app.js"></script></head><body data-page="shop"><div id="site-header"></div><main id="main-content" class="wrap page-shell"><div class="page-heading"><span class="eyebrow">THE STREET EDIT</span><h1>Jelajahi <span class="gradient-text">katalog.</span></h1><p>Temukan produk berdasarkan kebutuhan, kategori, dan rentang harga.</p></div><div class="catalog-layout"><aside class="filter-panel"><div class="filter-title"><h2>Filter</h2><button class="text-button" id="reset-filters" type="button">Reset</button></div><label class="field-label" for="shop-search">Cari produk</label><input class="input" id="shop-search" type="search" placeholder="Nama produk…"><label class="field-label" for="shop-category">Kategori</label><select class="input" id="shop-category"><option value="">Semua kategori</option></select><div class="filter-two"><div><label class="field-label" for="min-price">Harga min.</label><input class="input" id="min-price" type="number" min="0" placeholder="0"></div><div><label class="field-label" for="max-price">Harga maks.</label><input class="input" id="max-price" type="number" min="0" placeholder="Tanpa batas"></div></div><label class="check-row"><input id="in-stock" type="checkbox"> Hanya produk tersedia</label></aside><section class="catalog-results"><div class="catalog-toolbar"><span id="result-count" aria-live="polite">Memuat katalog…</span><div class="toolbar-actions"><label class="sr-only" for="sort-products">Urutkan produk</label><select id="sort-products" class="input compact-input"><option value="newest">Terbaru</option><option value="name">Nama A–Z</option><option value="low">Harga terendah</option><option value="high">Harga tertinggi</option></select><div class="view-switch" role="group" aria-label="Tampilan produk"><button type="button" data-view="grid" class="active" aria-label="Tampilan grid">▦</button><button type="button" data-view="list" aria-label="Tampilan list">☷</button></div></div></div><div id="shop-products" class="product-grid"></div><div class="load-more-wrap"><button id="load-more" class="btn btn-ghost" type="button" hidden>Muat lebih banyak</button></div></section></div></main><div id="site-footer"></div><div id="toast-root" class="toast-root" aria-live="polite"></div></body></html>
